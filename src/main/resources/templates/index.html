<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ConcertTix 🎸</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; text-align: center; padding: 50px; margin: 0; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #1e1e1e; padding: 20px; margin: 20px auto; width: 300px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .available { color: #4CAF50; font-weight: bold; }
        .sold { color: #F44336; font-weight: bold; }
        input { padding: 10px; border-radius: 5px; border: 1px solid #333; background: #2a2a2a; color: white; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #E91E63; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #C2185B; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎟️ ConcertTix</h1>
        <p>Book your tickets for the hottest concerts!</p>
        
        <div class="card" th:each="ticket : ${tickets}">
            <h3 th:text="${ticket.concert}">Concert Name</h3>
            
            <p th:class="${ticket.buyer == 'Available' ? 'available' : 'sold'}">
                Status: <span th:text="${ticket.buyer}">Available</span>
            </p>
            
            <form th:if="${ticket.buyer == 'Available'}" th:action="@{/buy}" method="post">
                <input type="hidden" name="id" th:value="${ticket.id}"/>
                <input type="text" name="buyer" placeholder="Your Name" required>
                <button type="submit">Buy Ticket</button>
            </form>
        </div>
    </div>
</body>
</html>
